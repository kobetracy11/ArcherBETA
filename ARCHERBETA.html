// ── HELPERS ──
function guessType(n){n=n.toLowerCase();if(n.includes('roof')||n.includes('hail')||n.includes('storm'))return 'storm';if(n.includes('fire')||n.includes('smoke')||n.includes('lunchroom'))return 'fire';if(n.includes('mold'))return 'mold';return 'water';}
function daysBetween(a,b){return Math.max(0,Math.round(Math.abs(new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5));}
function daysOpen(s){if(!s)return null;return Math.max(0,Math.round((TODAY-new Date(s+'T00:00:00'))/864e5));}
function fmtDate(s){if(!s)return '—';try{return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return s;}}
function fmtTime(t){if(!t)return '—';try{const[h,m]=t.split(':');const hh=parseInt(h);return(hh%12||12)+':'+m+(hh>=12?' PM':' AM');}catch(e){return t;}}
function calcHours(i,o){if(!i||!o)return null;const[ih,im]=i.split(':').map(Number);const[oh,om]=o.split(':').map(Number);const mins=(oh*60+om)-(ih*60+im);return mins>0?(mins/60).toFixed(1):null;}
function timeAgo(d){if(!d)return '';const m=Math.round((new Date()-d)/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';return Math.round(m/60)+'h ago';}
function initials(name){return name.split(' ').map(w=>w[0]).join('').toUpperCase().substring(0,2);}
function avatarColor(name){const colors=['#E6F1FB','#E1F5EE','#FAEEDA','#FAECE7','#F1EFE8','#EAF3DE'];const i=name.charCodeAt(0)%colors.length;return colors[i];}
function avatarTextColor(name){const colors=['#185FA5','#0F6E56','#854F0B','#993C1D','#5F5E5A','#3B6D11'];const i=name.charCodeAt(0)%colors.length;return colors[i];}
 
function setSyncBadge(s){
  const b=document.getElementById('sync-badge');b.className='sync-badge';
  if(s==='live'){b.classList.add('sync-live');b.innerHTML='<i class="ti ti-circle-check" style="font-size:11px"></i> Live';}
  if(s==='error'){b.classList.add('sync-err');b.innerHTML='<i class="ti ti-alert-circle" style="font-size:11px"></i> Offline';}
  if(s==='loading'){b.classList.add('sync-loading');b.innerHTML='<i class="ti ti-refresh" style="font-size:11px"></i> Syncing';}
}
 
// ── SYNC ──
async function refreshData(){
  setSyncBadge('loading');
  document.getElementById('sync-bar').innerHTML='<i class="ti ti-loader" style="font-size:13px"></i> Syncing with Google Sheet…';
  try{
    const res=await fetch(SCRIPT_URL,{method:'GET',mode:'cors'});
    const text=await res.text();
    let raw;try{raw=JSON.parse(text);}catch(e){const m=text.match(/\[.*\]/s);if(m)raw=JSON.parse(m[0]);else throw new Error('Bad response');}
    if(!Array.isArray(raw))throw new Error('Not an array');
    sheetJobs=raw.filter(r=>r&&r.name&&r.name.trim()!=='').map((r,i)=>({id:i+1,name:r.name.trim(),q:r.quarter||'',type:guessType(r.name),crew:'',start:r.start||'',closed:r.closed===true||(!!r.closeDate&&r.closeDate!==''),closeDate:r.closeDate||'',ins:'',fromSheet:true}));
    lastSync=new Date();
    setSyncBadge('live');
    document.getElementById('sync-bar').innerHTML='<i class="ti ti-circle-check" style="font-size:13px;color:var(--green)"></i> Live from Google Sheet · '+timeAgo(lastSync);
    populateSelects();
  }catch(e){
    setSyncBadge('error');
    document.getElementById('sync-bar').innerHTML='<i class="ti ti-alert-circle" style="font-size:13px;color:var(--red)"></i> Could not reach sheet — tap Refresh to try again';
  }
  renderJobs();
}

    getAllJobs().filter(j=>!j.closed).forEach(j=>{const o=document.createElement('option');o.value=j.name;o.textContent=j.name;ckJob.appendChild(o);});

}

        <div class="jinfo">

        </div>

          <span class="pill ${j.closed?'pill-closed':'pill-open'}">${j.closed?'Closed':'Open'}</span>
          <span class="day-badge ${hot?'hot':''}">${badge}</span>

  </div>`;
  employees.forEach(emp=>{
    const entries=timeEntries.filter(e=>e.emp===emp.name);
    const total=entries.reduce((s,e)=>{const h=calcHours(e.inTime,e.outTime);return s+(h?parseFloat(h):0);},0);
    html+=`<div class="tc-employee">
      <div class="tc-emp-header">
        <div>
          <div class="tc-emp-name">${emp.name}</div>
          <div class="tc-emp-hours">${emp.role||''} · ${total.toFixed(1)} hrs total</div>
        </div>
      </div>
      ${entries.length===0?'<div style="font-size:13px;color:var(--text3);padding:4px 0">No time entries yet.</div>':''}
      ${entries.slice(-3).reverse().map(e=>`
        <div class="tc-entry">
          <div><div style="color:var(--text2)">${e.date}</div><div style="font-size:11px;color:var(--text3);margin-top:1px">${e.jobName||'No job'}</div></div>
          <div style="text-align:right">
            <div style="font-weight:600;color:var(--text)">${fmtTime(e.inTime)} → ${e.outTime?fmtTime(e.outTime):'Active'}</div>
            <div style="font-size:11px;color:var(--text3)">${e.outTime?(calcHours(e.inTime,e.outTime)||'0')+' hrs':'In progress'}</div>
          </div>
        </div>`).join('')}
      ${entries.length>3?`<div style="font-size:11px;color:var(--text3);text-align:center;padding-top:6px">+${entries.length-3} more entries</div>`:''}
      <div class="tc-total">Total: ${total.toFixed(1)} hrs</div>
    </div>`;
  });
  c.innerHTML=html;
}
 
function openClockModal(){
  document.getElementById('ck-date').value=new Date().toISOString().split('T')[0];
  const now=new Date();
  document.getElementById('ck-in').value=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('ck-out').value='';
  document.getElementById('ck-notes').value='';
  populateSelects();
  document.getElementById('clock-modal').classList.add('open');
}
function clockModalOutside(e){if(e.target===document.getElementById('clock-modal'))closeModal('clock-modal');}
function submitClock(){
  const emp=document.getElementById('ck-emp').value;
  const date=document.getElementById('ck-date').value;
  const inTime=document.getElementById('ck-in').value;
  if(!emp||!date||!inTime){alert('Employee, date and time in are required.');return;}
  timeEntries.push({id:tcNextId++,emp,date,inTime,outTime:document.getElementById('ck-out').value,jobName:document.getElementById('ck-job').value,notes:document.getElementById('ck-notes').value});
  closeModal('clock-modal');
  renderTimeCards();
}
 
// ── VIEWS ──
function showView(v,el){
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('view-jobs').style.display=v==='jobs'?'block':'none';
  document.getElementById('view-timecard').style.display=v==='timecard'?'block':'none';
  document.getElementById('view-employees').style.display=v==='employees'?'block':'none';
  document.getElementById('job-filters').style.display=v==='jobs'?'flex':'none';
  if(v==='timecard')renderTimeCards();
  if(v==='employees')renderEmployees();
}
 
// ── NEW JOB ──
function openNewModal(){
  document.getElementById('nj-date').value=new Date().toISOString().split('T')[0];
  ['nj-name','nj-notes','nj-ins'].forEach(id=>document.getElementById(id).value='');
  populateSelects();
  document.getElementById('new-modal').classList.add('open');
}
function modalOutside(e){if(e.target===document.getElementById('new-modal'))closeModal('new-modal');}
function addJob(){
  const name=document.getElementById('nj-name').value.trim();
  const date=document.getElementById('nj-date').value;
  if(!name||!date){alert('Name and start date are required.');return;}
  const id=nextId++;
  localJobs.unshift({id,name,type:document.getElementById('nj-type').value,crew:document.getElementById('nj-crew').value,q:'',start:date,closed:false,closeDate:'',ins:document.getElementById('nj-ins').value.trim(),fromSheet:false});
  const notes=document.getElementById('nj-notes').value.trim();
  if(notes)jobNotes[id]=notes;
  closeModal('new-modal');
  currentFilter='open';
  document.querySelectorAll('.filter-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  renderJobs();
  populateSelects();
}
 
function closeModal(id){document.getElementById(id).classList.remove('open');}
 
refreshData();
setInterval(refreshData,5*60*1000);
</script>
