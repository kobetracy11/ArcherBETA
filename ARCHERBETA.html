<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARCHERBETA">
<title>ARCHERBETA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeece8;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9e9e9e;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-border:#C0DD97;
  --red:#993C1D;--red-bg:#FAECE7;--red-border:#F5C4B3;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --teal:#0F6E56;--teal-bg:#E1F5EE;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f2f2f7;--text2:#aeaeb2;--text3:#6d6d72;
    --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);
    --blue:#4a9eff;--blue-bg:#0a2540;
    --green:#7cc444;--green-bg:#1a2e0a;--green-border:#3b5c15;
    --red:#ff6b47;--red-bg:#2e0e05;--red-border:#5c2010;
    --amber:#f5a623;--amber-bg:#2e1e05;
    --teal:#2ec4a0;--teal-bg:#0a2e25;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;padding-bottom:90px}
.header{background:var(--bg);border-bottom:0.5px solid var(--border);padding:14px 16px 10px;position:sticky;top:0;z-index:40}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-size:17px;font-weight:700;letter-spacing:2px;color:var(--text)}
.logo span{font-size:10px;color:var(--text3);display:block;letter-spacing:1px;font-weight:400;margin-top:-2px}
.sync-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.sync-live{background:var(--green-bg);color:var(--green)}
.sync-err{background:var(--red-bg);color:var(--red)}
.sync-loading{background:var(--bg2);color:var(--text3)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border);background:var(--bg);color:var(--text2);white-space:nowrap;flex-shrink:0}
.filter-btn.active{background:var(--bg2);color:var(--text);border-color:var(--border2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg);color:var(--text);text-decoration:none}
.btn:active{opacity:0.7}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-drive{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 14px 4px}
.metric{background:var(--bg);border-radius:var(--radius-lg);padding:12px 10px;text-align:center;border:0.5px solid var(--border)}
.metric-val{font-size:28px;font-weight:700;line-height:1}
.metric-label{font-size:10px;color:var(--text2);margin-top:3px;font-weight:500}
.val-blue{color:var(--blue)}.val-green{color:var(--green)}
.sync-bar{text-align:center;font-size:11px;color:var(--text3);padding:6px 14px 10px;display:flex;align-items:center;justify-content:center;gap:6px}
.jobs-list{padding:0 14px;display:flex;flex-direction:column;gap:8px}
.job-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:13px 14px;cursor:pointer}
.job-card:active{opacity:0.75}
.jrow{display:flex;align-items:center;gap:10px}
.jicon{width:38px;height:38px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.i-water{background:var(--blue-bg);color:var(--blue)}
.i-fire{background:var(--red-bg);color:var(--red)}
.i-mold{background:var(--teal-bg);color:var(--teal)}
.i-storm{background:var(--amber-bg);color:var(--amber)}
.i-other{background:var(--bg2);color:var(--text2)}
.jinfo{flex:1;min-width:0}
.jname{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jmeta{font-size:11.5px;color:var(--text2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.jright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.pill{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.pill-open{background:var(--blue-bg);color:var(--blue)}
.pill-closed{background:var(--green-bg);color:var(--green)}
.day-badge{font-size:11px;font-weight:500;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border);padding:2px 8px;border-radius:6px;white-space:nowrap}
.day-badge.hot{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:0.5px solid var(--border);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom,10px)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;color:var(--text3);font-size:10px;gap:3px;text-decoration:none;font-weight:500}
.bnav-item.active{color:var(--blue)}
.bnav-item i{font-size:22px}
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:50;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,16px)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 14px}
.sheet-header{padding:0 18px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
.sheet-title{font-size:18px;font-weight:700;color:var(--text)}
.sheet-sub{font-size:12px;color:var(--text2);margin-top:4px}
.sheet-close{font-size:24px;color:var(--text3);cursor:pointer;padding-left:12px;flex-shrink:0;line-height:1}
.sheet-body{padding:18px}
.ssec{margin-bottom:22px}
.ssec-title{font-size:10px;color:var(--text3);letter-spacing:0.6px;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.big-num{font-size:56px;font-weight:700;color:var(--text);line-height:1}
.big-label{font-size:13px;color:var(--text2);margin-top:4px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--border)}
.srow:last-child{border-bottom:none}
.srow-label{font-size:13px;color:var(--text2)}
.srow-val{font-size:13px;font-weight:600;color:var(--text);text-align:right;max-width:65%}
.drive-strip{display:flex;align-items:center;gap:10px;background:var(--green-bg);border:0.5px solid var(--green-border);border-radius:var(--radius);padding:12px 14px;margin-top:8px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:60;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,16px)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.modal-header{padding:14px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:700}
.modal-body{padding:18px}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
.field textarea{resize:none;height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.modal-footer{padding:12px 18px;border-top:0.5px solid var(--border);display:flex;gap:10px}
.modal-footer .btn{flex:1;justify-content:center;padding:12px}
.debug-box{background:var(--bg2);border-radius:var(--radius);padding:12px;font-size:11px;color:var(--text2);word-break:break-all;margin:10px 14px;display:none}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">ARCHERBETA <span>RESTORATION</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="sync-badge sync-loading" id="sync-badge"><i class="ti ti-refresh" style="font-size:11px"></i>Syncing</span>
      <a class="btn btn-drive" href="https://drive.google.com/drive/u/0/folders/1ZAtp4mCnBoc8yV6KUVkbitL0RAWI0Dyl" target="_blank" style="padding:6px 10px;font-size:12px">
        <i class="ti ti-brand-google-drive"></i>Receipts
      </a>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('open',this)">Open</button>
    <button class="filter-btn" onclick="setFilter('closed',this)">Closed</button>
    <button class="filter-btn" onclick="setFilter('all',this)">All Jobs</button>
  </div>
</div>

<div class="metrics" id="metrics">
  <div class="metric"><div class="metric-val val-blue">—</div><div class="metric-label">Open</div></div>
  <div class="metric"><div class="metric-val val-green">—</div><div class="metric-label">Closed</div></div>
  <div class="metric"><div class="metric-val">—</div><div class="metric-label">Total</div></div>
</div>
<div class="sync-bar" id="sync-bar"><i class="ti ti-loader" style="font-size:13px"></i> Connecting to Google Sheet…</div>
<div class="debug-box" id="debug-box"></div>
<div id="list-wrap"></div>

<div class="bottomnav">
  <div class="bnav-item active" onclick="setNav(this)"><i class="ti ti-clipboard-list"></i>Jobs</div>
  <div class="bnav-item" onclick="refreshData()"><i class="ti ti-refresh"></i>Refresh</div>
  <div class="bnav-item" onclick="openNewModal()"><i class="ti ti-circle-plus"></i>New Job</div>
  <a class="bnav-item" href="https://drive.google.com/drive/u/0/folders/1ZAtp4mCnBoc8yV6KUVkbitL0RAWI0Dyl" target="_blank"><i class="ti ti-brand-google-drive"></i>Drive</a>
</div>

<div class="sheet-overlay" id="sheet-overlay" onclick="sheetOutside(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div><div class="sheet-title" id="sheet-title"></div><div class="sheet-sub" id="sheet-sub"></div></div>
      <span class="sheet-close" onclick="closeSheet()"><i class="ti ti-x"></i></span>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="modal-overlay" id="new-modal" onclick="modalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">New Job</span>
      <span style="font-size:24px;color:var(--text3);cursor:pointer" onclick="closeModal()"><i class="ti ti-x"></i></span>
    </div>
    <div class="modal-body">
      <div class="field"><label>Customer / Job name</label><input id="nj-name" placeholder="Full name or company" autocomplete="off"></div>
      <div class="grid2">
        <div class="field" style="margin-bottom:0"><label>Start date</label><input id="nj-date" type="date"></div>
        <div class="field" style="margin-bottom:0"><label>Job type</label>
          <select id="nj-type">
            <option value="water">Water Damage</option>
            <option value="fire">Fire Damage</option>
            <option value="mold">Mold Remediation</option>
            <option value="storm">Storm Damage</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="grid2" style="margin-top:14px">
        <div class="field" style="margin-bottom:0"><label>Crew member</label>
          <select id="nj-crew">
            <option>Jake A.</option><option>Sara M.</option><option>Tom R.</option><option>Kira L.</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:0"><label>Insurance #</label><input id="nj-ins" placeholder="Optional" autocomplete="off"></div>
      </div>
      <div class="field" style="margin-top:14px"><label>Notes</label><textarea id="nj-notes" placeholder="Initial damage notes…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addJob()"><i class="ti ti-check"></i>Add Job</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmdpUH5d0XojZNH6lb7kRSRLJXiVJyPh9GP1GfmuNeY3_ZihX9zkZJ-yHTYKgyZIhR/exec';
const DRIVE = 'https://drive.google.com/drive/u/0/folders/1ZAtp4mCnBoc8yV6KUVkbitL0RAWI0Dyl';
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

const typeIcon  = {water:'ti-droplet',fire:'ti-flame',mold:'ti-leaf',storm:'ti-cloud-storm',other:'ti-tool'};
const typeCls   = {water:'i-water',fire:'i-fire',mold:'i-mold',storm:'i-storm',other:'i-other'};
const typeLabel = {water:'Water Damage',fire:'Fire Damage',mold:'Mold Remediation',storm:'Storm Damage',other:'Other'};

let sheetJobs = [];
let localJobs = [];
let currentFilter = 'open';
let activeJob = null;
let lastSync = null;
let nextId = 10000;

function guessType(name){
  const n = name.toLowerCase();
  if(n.includes('roof')||n.includes('hail')||n.includes('storm')||n.includes('wind')) return 'storm';
  if(n.includes('fire')||n.includes('smoke')||n.includes('soot')||n.includes('lunchroom')) return 'fire';
  if(n.includes('mold')||n.includes('mould')) return 'mold';
  return 'water';
}
function daysBetween(a,b){
  return Math.max(0,Math.round(Math.abs(new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5));
}
function daysOpen(s){
  if(!s) return null;
  return Math.max(0,Math.round((TODAY-new Date(s+'T00:00:00'))/864e5));
}
function fmtDate(s){
  if(!s) return '—';
  try{ return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
  catch(e){ return s; }
}
function timeAgo(d){
  if(!d) return '';
  const mins=Math.round((new Date()-d)/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  return Math.round(mins/60)+'h ago';
}
function setSyncBadge(state){
  const b=document.getElementById('sync-badge');
  b.className='sync-badge';
  if(state==='live')    {b.classList.add('sync-live');    b.innerHTML='<i class="ti ti-circle-check" style="font-size:11px"></i> Live';}
  if(state==='error')   {b.classList.add('sync-err');     b.innerHTML='<i class="ti ti-alert-circle" style="font-size:11px"></i> Offline';}
  if(state==='loading') {b.classList.add('sync-loading'); b.innerHTML='<i class="ti ti-refresh" style="font-size:11px"></i> Syncing';}
}

async function refreshData(){
  setSyncBadge('loading');
  document.getElementById('sync-bar').innerHTML='<i class="ti ti-loader" style="font-size:13px"></i> Syncing with Google Sheet…';
  try{
    // Use no-cors mode won't work for reading data, so we use cors with callback
    const url = SCRIPT_URL + '?callback=cb&t=' + Date.now();
    const res = await fetch(SCRIPT_URL, {method:'GET', mode:'cors'});
    const text = await res.text();

    // Try parsing as JSON
    let raw;
    try{
      raw = JSON.parse(text);
    } catch(e){
      // Sometimes Apps Script wraps in callback — strip it
      const match = text.match(/\[.*\]/s);
      if(match) raw = JSON.parse(match[0]);
      else throw new Error('Bad response: ' + text.substring(0,100));
    }

    if(!Array.isArray(raw)) throw new Error('Not an array');

    sheetJobs = raw
      .filter(r => r && r.name && r.name.trim() !== '')
      .map((r,i) => ({
        id: i+1,
        name: r.name.trim(),
        q: r.quarter||'',
        type: guessType(r.name),
        crew:'',
        start: r.start||'',
        closed: r.closed===true||(!!r.closeDate&&r.closeDate!==''),
        closeDate: r.closeDate||'',
        ins:'', notes:'',
        fromSheet:true,
      }));

    lastSync = new Date();
    setSyncBadge('live');
    document.getElementById('sync-bar').innerHTML =
      '<i class="ti ti-circle-check" style="font-size:13px;color:var(--green)"></i> Live from Google Sheet · '+timeAgo(lastSync);
    document.getElementById('debug-box').style.display='none';

  } catch(e){
    setSyncBadge('error');
    document.getElementById('sync-bar').innerHTML =
      '<i class="ti ti-alert-circle" style="font-size:13px;color:var(--red)"></i> Could not reach sheet — tap Refresh to try again';
    const dbg = document.getElementById('debug-box');
    dbg.style.display='block';
    dbg.textContent = 'Error: '+e.message;
  }
  render();
}

function getAllJobs(){ return [...sheetJobs,...localJobs]; }
function getFiltered(){
  const all=getAllJobs();
  if(currentFilter==='open')   return all.filter(j=>!j.closed);
  if(currentFilter==='closed') return all.filter(j=>j.closed);
  return all;
}

function render(){
  const all=getAllJobs();
  const open=all.filter(j=>!j.closed).length;
  const closed=all.filter(j=>j.closed).length;
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-val val-blue">${open}</div><div class="metric-label">Open</div></div>
    <div class="metric"><div class="metric-val val-green">${closed}</div><div class="metric-label">Closed</div></div>
    <div class="metric"><div class="metric-val">${all.length}</div><div class="metric-label">Total</div></div>
  `;
  const items=getFiltered();
  const wrap=document.getElementById('list-wrap');
  if(!items.length){
    wrap.innerHTML='<div style="text-align:center;color:var(--text3);padding:50px 20px;font-size:14px">'+(sheetJobs.length===0?'Tap Refresh to load jobs from your sheet.':'No jobs in this view.')+'</div>';
    return;
  }
  wrap.innerHTML='<div class="jobs-list">'+items.map(j=>{
    const days = j.closed&&j.closeDate&&j.start ? daysBetween(j.start,j.closeDate)
               : j.start ? daysOpen(j.start) : null;
    const hot = !j.closed&&days!==null&&days>14;
    const badge = j.closed&&j.closeDate&&j.start ? days+'d job'
                : j.closed ? 'Closed'
                : days!==null ? 'Day '+days : '—';
    return `<div class="job-card" onclick="openSheet(${j.id})">
      <div class="jrow">
        <div class="jicon ${typeCls[j.type]}"><i class="ti ${typeIcon[j.type]}"></i></div>
        <div class="jinfo">
          <div class="jname">${j.name}</div>
          <div class="jmeta">
            ${j.start?`<span><i class="ti ti-calendar" style="font-size:11px;vertical-align:-1px"></i> ${fmtDate(j.start)}</span>`:'<span style="color:var(--text3)">No start date</span>'}
            ${j.q?`<span style="background:var(--bg2);padding:1px 6px;border-radius:4px;font-size:10px">${j.q}</span>`:''}
            ${!j.fromSheet?'<span style="background:var(--blue-bg);color:var(--blue);padding:1px 6px;border-radius:4px;font-size:10px">New</span>':''}
          </div>
        </div>
        <div class="jright">
          <span class="pill ${j.closed?'pill-closed':'pill-open'}">${j.closed?'Closed':'Open'}</span>
          <span class="day-badge ${hot?'hot':''}">${badge}</span>
        </div>
      </div>
    </div>`;
  }).join('')+'</div>';
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function openSheet(id){
  activeJob=getAllJobs().find(j=>j.id===id);
  if(!activeJob) return;
  const j=activeJob;
  const days = j.closed&&j.closeDate&&j.start ? daysBetween(j.start,j.closeDate)
             : j.start ? daysOpen(j.start) : null;
  document.getElementById('sheet-title').textContent=j.name;
  document.getElementById('sheet-sub').textContent=typeLabel[j.type]+(j.q?' · '+j.q:'');
  document.getElementById('sheet-body').innerHTML=`
    <div class="ssec">
      <div style="display:flex;align-items:flex-end;gap:16px;margin-bottom:8px">
        <div>
          <div class="big-num">${days!==null?days:'—'}</div>
          <div class="big-label">${j.closed&&j.closeDate?'days (job duration)':'days since start'}</div>
        </div>
        <span class="pill ${j.closed?'pill-closed':'pill-open'}" style="font-size:13px;padding:5px 14px;margin-bottom:8px">${j.closed?'Closed':'Open'}</span>
      </div>
    </div>
    <div class="ssec">
      <div class="ssec-title">Job Details</div>
      <div class="srow"><span class="srow-label">Quarter</span><span class="srow-val">${j.q||'—'}</span></div>
      <div class="srow"><span class="srow-label">Start date</span><span class="srow-val">${fmtDate(j.start)}</span></div>
      ${j.closed&&j.closeDate?`<div class="srow"><span class="srow-label">Date completed</span><span class="srow-val">${fmtDate(j.closeDate)}</span></div>`:''}
      ${j.closed&&j.closeDate&&j.start?`<div class="srow"><span class="srow-label">Duration</span><span class="srow-val">${days} day${days!==1?'s':''}</span></div>`:''}
      ${j.ins?`<div class="srow"><span class="srow-label">Insurance #</span><span class="srow-val">${j.ins}</span></div>`:''}
    </div>
    ${j.fromSheet?`
    <div style="background:var(--blue-bg);border-radius:var(--radius);padding:10px 13px;font-size:12px;color:var(--blue);margin-bottom:18px">
      <i class="ti ti-table" style="font-size:14px;vertical-align:-2px"></i>
      Update dates in Column M (start) or Column O (completed) in your Google Sheet. Tap Refresh to sync.
    </div>`:''}
    <div class="drive-strip">
      <i class="ti ti-brand-google-drive" style="font-size:22px;color:var(--green);flex-shrink:0"></i>
      <div style="flex:1;font-size:13px;font-weight:600;color:var(--green)">Job Receipts Folder</div>
      <a href="${DRIVE}" target="_blank" class="btn btn-drive" style="font-size:12px;padding:7px 11px"><i class="ti ti-external-link"></i>Open</a>
    </div>
  `;
  document.getElementById('sheet-overlay').classList.add('open');
}

function closeSheet(){document.getElementById('sheet-overlay').classList.remove('open');}
function sheetOutside(e){if(e.target===document.getElementById('sheet-overlay'))closeSheet();}

function openNewModal(){
  document.getElementById('nj-date').value=new Date().toISOString().split('T')[0];
  ['nj-name','nj-notes','nj-ins'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('new-modal').classList.add('open');
}
function closeModal(){document.getElementById('new-modal').classList.remove('open');}
function modalOutside(e){if(e.target===document.getElementById('new-modal'))closeModal();}

function addJob(){
  const name=document.getElementById('nj-name').value.trim();
  const date=document.getElementById('nj-date').value;
  if(!name||!date){alert('Name and start date are required.');return;}
  localJobs.unshift({
    id:nextId++,name,
    type:document.getElementById('nj-type').value,
    crew:document.getElementById('nj-crew').value,
    q:'',start:date,closed:false,closeDate:'',
    ins:document.getElementById('nj-ins').value.trim(),
    notes:document.getElementById('nj-notes').value.trim(),
    fromSheet:false,
  });
  closeModal();
  currentFilter='open';
  document.querySelectorAll('.filter-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  render();
}

function setNav(el){
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

refreshData();
setInterval(refreshData, 5*60*1000);
</script>
</body>
</html>
